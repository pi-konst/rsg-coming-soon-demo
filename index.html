<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon strip — v2 (after review)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
 * v2 of the Coming Soon strip, with the review's accepted findings applied:
 *   - no timeline; ordered date pills carry the sequence
 *   - title under the square, two lines, never over the artwork; no kicker
 *   - card floor 136 px on phones and foldable cover screens
 *   - arrows whenever the row overflows, on every input type; 16 px edge fades
 *   - one upcoming project is one card in the strip, no grid relocation
 *   - list semantics, <time>, a heading, real destinations, an inset focus ring
 */
:root {
    --bg: #131313;
    --text: #F2F2F2;
    --muted: #9D9C9D;
    --red: #B61A39;
    --red-dark: #5C0D1D;
    --card: 176px;
    --gap: 12px;
    --radius: 14px;
    --inset: 40px;
}
@media (max-width: 1023px) { :root { --card: 152px; --inset: 24px; } }
@media (max-width: 767px)  { :root { --card: 136px; --inset: 16px; --gap: 10px; --radius: 12px; } }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Montserrat, sans-serif; }
a { color: inherit; text-decoration: none; }
.page { max-width: 1280px; margin: 0 auto; padding: 0 var(--inset); }

/* ------------------------------------------------------------- page sketch */
.hdr { height: 64px; margin: 16px 0 24px; border-radius: 16px; background: #1D1D1D; display: flex; align-items: center; padding: 0 20px; gap: 24px; }
.hdr__logo { font-weight: 700; font-size: 12px; line-height: 12px; letter-spacing: .02em; }
.hdr__nav { margin-left: auto; display: flex; gap: 20px; font-weight: 700; font-size: 12px; }
.hdr__cta { background: var(--red); padding: 10px 14px; border-radius: 8px; }
@media (max-width: 767px) { .hdr__nav { display: none; } }
.sketch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 767px) { .sketch { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 539px) { .sketch { grid-template-columns: 1fr; } }
.sketch__tile { aspect-ratio: 1; border-radius: 18px; border: 1px solid rgba(242,242,242,.08); background: linear-gradient(160deg, #262626, #1A1A1A); display: grid; place-items: center; color: #555; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.sketch__tile--tall { aspect-ratio: 1 / 1.25; }
.section-gap { height: 24px; }

/* ------------------------------------------------------------- the strip */
.cs { position: relative; padding: 16px 0 12px; }

.cs__head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-height: 36px; }
.cs__title { margin: 0; font-weight: 700; font-size: 12px; line-height: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.cs__count { color: var(--muted); font-weight: 600; }

/* Arrows: in the head, shown whenever the row overflows, on every input. 36 px visible, 44 px hit area. */
.cs__nav { margin-left: auto; display: none; gap: 8px; }
.cs.is-more .cs__nav { display: flex; }
.cs__arrow { position: relative; width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(242,242,242,.16); background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.cs__arrow::before { content: ""; position: absolute; inset: -4px; }
.cs__arrow:hover { background: rgba(242,242,242,.08); }
.cs__arrow:disabled { opacity: .3; cursor: default; }
.cs__arrow:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.cs__scroller { position: relative; }
.cs__scroller::before, .cs__scroller::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 16px; pointer-events: none; z-index: 2;
    opacity: 0; transition: opacity .2s;
}
.cs__scroller::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
.cs__scroller::after { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }
.cs.can-prev .cs__scroller::before { opacity: 1; }
.cs.can-next .cs__scroller::after { opacity: 1; }

.cs__list { list-style: none; margin: 0; padding: 0; display: flex; gap: var(--gap); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding: 0 16px; }
.cs__list::-webkit-scrollbar { display: none; }
.cs__item { flex: 0 0 var(--card); scroll-snap-align: start; }

.cs__link { display: block; border-radius: var(--radius); }
.cs__link:focus-visible { outline: none; }
.cs__link:focus-visible .cs__cover { box-shadow: inset 0 0 0 2px var(--text); }

.cs__cover { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; border: 1px solid rgba(242,242,242,.1); background: #222; }
.cs__cover img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.cs__link:hover .cs__cover img { transform: scale(1.05); }

/* Opaque pill: no backdrop-filter, so contrast does not depend on the art. */
.cs__date { position: absolute; top: 8px; left: 8px; z-index: 1; padding: 3px 7px; border-radius: 6px; background: #161616; font-weight: 600; font-size: 11px; line-height: 14px; color: #fff; letter-spacing: .02em; }
.cs__item--major .cs__date { background: radial-gradient(80% 80% at 50% 50%, #C21A3C 0%, #B61A39 60%, var(--red-dark) 100%); }

/* Caption under the square: the art stays whole, the name stays readable. Two lines reserved so the row keeps one height. */
.cs__name { margin: 6px 2px 0; font-weight: 700; font-size: 12px; line-height: 16px; height: 32px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cs__link:hover .cs__name { color: #fff; }

.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

@media (prefers-reduced-motion: reduce) {
    .cs__cover img, .cs__scroller::before, .cs__scroller::after { transition: none; }
    .cs__link:hover .cs__cover img { transform: none; }
}

.note { margin: 8px 0 0; font-size: 11px; line-height: 16px; color: #666; font-weight: 600; letter-spacing: .04em; }
.note b { color: #999; }
</style>
</head>
<body>
<div class="page">

    <div class="hdr">
        <div class="hdr__logo">RETRO<br>STYLE<br>GAMES</div>
        <div class="hdr__nav"><span>SERVICES</span><span>PORTFOLIO</span><span>ABOUT</span><span>BLOG</span><span>CAREERS</span><span>OUR GAMES</span><span class="hdr__cta">HIRE US</span></div>
    </div>

    <div class="sketch" aria-hidden="true">
        <div class="sketch__tile sketch__tile--tall">Featured</div>
        <div class="sketch__tile sketch__tile--tall">Featured</div>
        <div class="sketch__tile sketch__tile--tall">Featured</div>
        <div class="sketch__tile sketch__tile--tall">Featured</div>
    </div>

    <div class="section-gap"></div>

    <section class="cs" id="coming-soon" aria-labelledby="coming-soon-title">
        <div class="cs__head">
            <h2 class="cs__title" id="coming-soon-title">Coming soon <span class="cs__count">· <span data-count></span></span></h2>
            <div class="cs__nav">
                <button type="button" class="cs__arrow" data-dir="-1" aria-controls="coming-soon-list" aria-label="Previous upcoming projects"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <button type="button" class="cs__arrow" data-dir="1" aria-controls="coming-soon-list" aria-label="Next upcoming projects"><svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
        </div>
        <div class="cs__scroller">
            <ul class="cs__list" id="coming-soon-list"></ul>
        </div>
        <p class="note" data-measure></p>
    </section>

    <div class="section-gap"></div>

    <div class="sketch" aria-hidden="true">
        <div class="sketch__tile">Grid tile</div>
        <div class="sketch__tile">Grid tile</div>
        <div class="sketch__tile">Grid tile</div>
        <div class="sketch__tile">Grid tile</div>
    </div>

    <div class="section-gap"></div>
</div>

<script>
(function () {
    'use strict';

    // The nine projects the live block shows on 17.09.2026, in release-date order.
    var CARDS = [
        { iso: '2026-09-22', date: '22.09.2026', title: 'Last Wizard Co-op Kit', major: false, href: 'https://retrostylegames.com/portfolio/last-wizard-coop-friendslop-asset-pack/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/07/last-wizard-key-art-square-store-480x480.jpg' },
        { iso: '2026-09-25', date: '25.09.2026', title: 'Odin’s Vault', major: true, href: 'https://retrostylegames.com/portfolio/odin-vault-2d-slot-art-and-character/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/08/OdinsVault-ComingSoon-972972-site-480x480.jpg' },
        { iso: '2026-11-06', date: '06.11.2026', title: 'Adventure Escape Mysteries', major: false, href: 'https://retrostylegames.com/portfolio/adventure-escape-mysteries-realistic-2d-art/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/07/Haiku_E43_02_972972-no_label-480x480.jpg' },
        { iso: '2026-11-13', date: '13.11.2026', title: 'Guardians of the Wild Sky', major: true, href: 'https://retrostylegames.com/portfolio/guardians-of-the-wild-sky-3d-fantasy-characters-and-creatures/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/04/Guardians-of-the-Wild-Sky-st02-972%D1%85972-768x768.jpg' },
        { iso: '2026-11-19', date: '19.11.2026', title: 'Iron Games', major: false, href: 'https://retrostylegames.com/portfolio/iron-games-ui-ux-icon-design/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/06/diggy-match-portfolio-art-480x480.png' },
        { iso: '2026-11-24', date: '24.11.2026', title: 'Little Monsters', major: false, href: 'https://retrostylegames.com/portfolio/little-monsters-3d-slot-game-characters-and-backgrounds/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/05/972%D1%85972-clean-768x768.png' },
        { iso: '2026-11-26', date: '26.11.2026', title: 'Puzzle Town Mysteries', major: false, href: 'https://retrostylegames.com/portfolio/puzzle-town-mysteries-ui-ux-character-design/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/07/Puzzle-Town-Mysteries-Cover-480x480.jpg' },
        { iso: '2026-11-30', date: '30.11.2026', title: 'Silkroad Online', major: false, href: 'https://retrostylegames.com/portfolio/silkroad-online-3d-character-outfits-and-skins/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/05/Gamegami-Silkroad-Part2-st02-972%D1%85972-800x800.jpg' },
        { iso: '2026-12-04', date: '04.12.2026', title: 'Titan Ways', major: false, href: 'https://retrostylegames.com/portfolio/titan-ways-slot-game-art-and-ui/', img: 'https://images.retrostylegames.com/wp-content/uploads/2026/08/TitanWays-ComingSoon-972972_Site-01-800x800.jpg' }
    ];

    function card(c, i) {
        var li = document.createElement('li');
        li.className = 'cs__item' + (c.major ? ' cs__item--major' : '');
        li.innerHTML =
            '<a class="cs__link" href="' + c.href + '">' +
                '<div class="cs__cover">' +
                    '<time class="cs__date" datetime="' + c.iso + '">' + c.date + (c.major ? '<span class="visually-hidden">, major release</span>' : '') + '</time>' +
                    '<img src="' + c.img + '" alt="" width="480" height="480" decoding="async" loading="' + (i < 5 ? 'eager' : 'lazy') + '">' +
                '</div>' +
                '<span class="cs__name">' + c.title + '</span>' +
            '</a>';
        return li;
    }

    var section = document.getElementById('coming-soon');
    var list = document.getElementById('coming-soon-list');
    var prev = section.querySelector('[data-dir="-1"]');
    var next = section.querySelector('[data-dir="1"]');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    CARDS.forEach(function (c, i) { list.appendChild(card(c, i)); });
    section.querySelector('[data-count]').textContent = String(CARDS.length);

    function sync() {
        var more = list.scrollWidth > list.clientWidth + 1;
        var atStart = list.scrollLeft <= 1;
        var atEnd = list.scrollLeft + list.clientWidth >= list.scrollWidth - 1;
        section.classList.toggle('is-more', more);
        section.classList.toggle('can-prev', more && !atStart);
        section.classList.toggle('can-next', more && !atEnd);
        prev.disabled = atStart;
        next.disabled = atEnd;
    }

    function step(dir) {
        var item = list.querySelector('.cs__item');
        var gap = parseFloat(getComputedStyle(list).gap) || 0;
        var unit = item.getBoundingClientRect().width + gap;
        var visible = Math.max(1, Math.floor((list.clientWidth + gap) / unit));
        list.scrollBy({ left: dir * unit * visible, behavior: reduced ? 'auto' : 'smooth' });
    }

    // Live numbers in the page, so a screenshot carries them. Measured on load and resize only.
    function measure() {
        var note = section.querySelector('[data-measure]');
        var h = Math.round(section.getBoundingClientRect().height - note.getBoundingClientRect().height - 8);
        var pct = Math.round(h / window.innerHeight * 100);
        var w = Math.round(list.querySelector('.cs__item').getBoundingClientRect().width);
        note.innerHTML = 'strip <b>' + h + 'px</b> = <b>' + pct + '%</b> of a ' + window.innerWidth + '×' + window.innerHeight + ' viewport · card ' + w + 'px';
    }

    prev.addEventListener('click', function () { step(-1); });
    next.addEventListener('click', function () { step(1); });
    list.addEventListener('scroll', sync, { passive: true });

    // The container, not the viewport: a tab switch or a fold changes the row's width without a resize.
    if ('ResizeObserver' in window) {
        new ResizeObserver(function () { sync(); measure(); }).observe(list);
    } else {
        window.addEventListener('resize', function () { sync(); measure(); });
    }
    sync();
    measure();
})();
</script>
</body>
</html>
